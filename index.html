<!doctype html>
<html lang="id" data-theme="terang" data-teks="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://accounts.google.com/gsi/ https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; manifest-src 'self'; worker-src 'self'">
<meta name="description" content="Uangmu ke mana aja? Catat uang masuk dan keluar dengan cepat. Datanya tersimpan di Google Sheets milikmu sendiri.">
<meta name="theme-color" content="#F3F5F9" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kemana">
<title>Kemana</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/boot.js"></script>
</head>
<body>

<!-- Layar awal: masuk, pilih/buat spreadsheet, memuat, galat -->
<div class="screen" id="screen" hidden></div>

<!-- Aplikasi -->
<div class="shell" id="shell" hidden>
  <header class="topbar">
    <h1 id="title">Catat</h1>
    <button class="status" id="status" type="button" data-act="status" hidden></button>
  </header>

  <main class="main">
    <!-- CATAT -->
    <section class="tab" id="tab-catat" aria-labelledby="title">
      <div class="editbar" id="editBar" hidden>
        <span>Mengubah transaksi</span>
        <button class="link" type="button" data-act="batal-edit">Batal</button>
      </div>
      <div class="seg seg-jenis" id="segJenis" role="group" aria-label="Jenis transaksi">
        <button type="button" data-act="jenis" data-v="Pengeluaran">Pengeluaran</button>
        <button type="button" data-act="jenis" data-v="Pemasukan">Pemasukan</button>
        <button type="button" data-act="jenis" data-v="Transfer">Transfer</button>
      </div>
      <div class="amount-row">
        <div class="amount empty" id="amount" aria-live="polite">
          <span class="rp">Rp</span><span class="val num" id="amountVal">0</span>
        </div>
        <button type="button" class="nota-btn" id="notaBtn" data-act="nota" aria-label="Isi dari foto nota atau screenshot">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>Nota</span>
        </button>
        <input type="file" id="notaFile" accept="image/*" hidden>
      </div>
      <div class="quick" id="quick" hidden></div>
      <div class="keypad" id="keypad">
        <button type="button" data-act="key" data-k="1">1</button><button type="button" data-act="key" data-k="2">2</button><button type="button" data-act="key" data-k="3">3</button>
        <button type="button" data-act="key" data-k="4">4</button><button type="button" data-act="key" data-k="5">5</button><button type="button" data-act="key" data-k="6">6</button>
        <button type="button" data-act="key" data-k="7">7</button><button type="button" data-act="key" data-k="8">8</button><button type="button" data-act="key" data-k="9">9</button>
        <button type="button" data-act="key" data-k="000" class="k000">000</button><button type="button" data-act="key" data-k="0">0</button>
        <button type="button" data-act="key" data-k="del" aria-label="Hapus angka (tahan untuk hapus semua)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m17 9-6 6M11 9l6 6"/></svg>
        </button>
      </div>
      <div class="field" id="fKategori">
        <div class="label">Kategori</div>
        <div class="chips" id="chipsKategori"></div>
      </div>
      <div class="field">
        <div class="label" id="lblDompet">Dompet</div>
        <div class="chips" id="chipsDompet"></div>
      </div>
      <div class="field" id="fKe" hidden>
        <div class="label">Ke dompet</div>
        <div class="chips" id="chipsKe"></div>
      </div>
      <div class="row2">
        <label class="date-chip" id="dateChip">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span id="dateLabel">Hari ini</span>
          <input type="date" id="dateInput" aria-label="Tanggal transaksi">
        </label>
        <input class="input" id="catatan" type="text" placeholder="Catatan (boleh kosong)" maxlength="140" autocomplete="off" enterkeyhint="done">
      </div>
      <div class="form-actions" id="formActions"></div>
    </section>

    <!-- RIWAYAT -->
    <section class="tab" id="tab-riwayat" hidden>
      <div class="monthnav">
        <button type="button" class="icon-btn" data-act="bulan" data-d="-1" aria-label="Bulan sebelumnya">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <b class="rBulan"></b>
        <button type="button" class="icon-btn" data-act="bulan" data-d="1" aria-label="Bulan berikutnya">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="cari" type="search" placeholder="Cari kategori, catatan, atau nominal" autocomplete="off" aria-label="Cari transaksi">
      </label>
      <div class="chips filters" id="filterJenis"></div>
      <div class="sumline" id="rSum"></div>
      <div id="rList"></div>
    </section>

    <!-- RINGKASAN -->
    <section class="tab" id="tab-ringkasan" hidden>
      <div id="sumBody"></div>
    </section>

    <!-- PENGATURAN -->
    <section class="tab" id="tab-pengaturan" hidden>
      <div id="setBody"></div>
    </section>
  </main>

  <nav class="nav" id="nav" aria-label="Menu utama">
    <button type="button" data-act="tab" data-tab="catat">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Catat</span>
    </button>
    <button type="button" data-act="tab" data-tab="riwayat">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      <span>Riwayat</span>
    </button>
    <button type="button" data-act="tab" data-tab="ringkasan">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Ringkasan</span>
    </button>
    <button type="button" data-act="tab" data-tab="pengaturan">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Pengaturan</span>
    </button>
  </nav>
</div>

<!-- Lembar (form dompet/kategori, konfirmasi) -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheetBox" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button type="button" id="toastAction" hidden></button></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
