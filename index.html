<!doctype html>
<html lang="id" data-theme="terang" data-teks="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#FAFAF9" id="metaTheme">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kemana">
<title>Kemana</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png" sizes="180x180">
<link rel="stylesheet" href="css/app.css">
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/config.js">
<link rel="modulepreload" href="js/format.js">
<link rel="modulepreload" href="js/kabar.js">
<link rel="modulepreload" href="js/schema.js">
<link rel="modulepreload" href="js/compute.js">
<link rel="modulepreload" href="js/google.js">
<link rel="modulepreload" href="js/sheets.js">
<link rel="modulepreload" href="js/nota.js">
<script src="js/boot.js"></script>
</head>
<body data-view="screen">
<noscript><p style="padding:1.5rem;font:16px/1.5 sans-serif">Kemana butuh JavaScript. Aktifkan JavaScript di browser lalu muat ulang halaman ini.</p></noscript>
<script nomodule src="js/nomodule.js"></script>

<svg class="sprite" aria-hidden="true" focusable="false"><symbol id="i-catat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></g></symbol><symbol id="i-riwayat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></g></symbol><symbol id="i-ringkasan" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h17M8 16v-5M13 16V7M18 16v-8"/></g></symbol><symbol id="i-pengaturan" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3-.5 2-2 1-2-.5-1.5 2.6L4.5 10v2L3 14l1.5 2.6 2-.5 2 1 .5 2h3l.5-2 2-1 2 .5L18 14l-1.5-2v-2L18 8.1l-1.5-2.6-2 .5-2-1L12 3Z" transform="translate(1.5 1)"/><circle cx="12" cy="12" r="2.75"/></g></symbol><symbol id="i-cari" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></g></symbol><symbol id="i-chevron" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g></symbol><symbol id="i-tutup" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></g></symbol><symbol id="i-centang" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.5 4.5L19 7"/></g></symbol><symbol id="i-kalender" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h2M14 14h2M8 17h2"/></g></symbol><symbol id="i-dompet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 8V5a2 2 0 0 0-2-2H6a3 3 0 0 0 0 6h14v11H6a3 3 0 0 1-3-3V6"/><path d="M20 12h-5v5h5M17 14.5h.01"/></g></symbol><symbol id="i-transfer" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></g></symbol><symbol id="i-nota" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6 9.5 3h5L16 6h4a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"/><circle cx="12" cy="12.5" r="4"/></g></symbol><symbol id="i-hapus-angka" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-7-7Z"/><path d="m11 9 6 6M17 9l-6 6"/></g></symbol><symbol id="i-edit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16 11-11 4 4L8 20H4Z"/><path d="m13 7 4 4m0-8 4 4-2 2-4-4Z"/></g></symbol><symbol id="i-hapus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></g></symbol><symbol id="i-lainnya" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></g></symbol><symbol id="i-kabar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 7 3 7 3 8H3c0-1 3-1 3-8M10 21h4"/></g></symbol><symbol id="i-peringatan" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 10 18H2Z M12 9v5M12 17h.01"/></g></symbol><symbol id="i-offline" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 18 18M3 8a15 15 0 0 1 2.7-1.7M10 5.2A15 15 0 0 1 21 8M6 12a10 10 0 0 1 3.1-1.5M14 10.5a10 10 0 0 1 4 1.5M9 16a5 5 0 0 1 6 0M12 20h.01"/></g></symbol><symbol id="i-sinkron" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4v5h-5M4 20v-5h5M5.2 8a7.5 7.5 0 0 1 12.4-3L20 9M4 15l2.4 4A7.5 7.5 0 0 0 19 16"/></g></symbol></svg>

<!-- Layar awal: masuk, pilih/buat spreadsheet, memuat, galat -->
<div class="screen" id="screen" hidden></div>

<!-- Aplikasi -->
<div class="shell" id="shell" hidden>
  <header class="topbar">
    <h1 id="title">Catat</h1>
    <button class="status" id="status" type="button" data-act="status" hidden></button>
    <button class="bell" id="bell" type="button" data-act="kabar" aria-label="Kabar dan pembaruan">
      <svg class="ic" aria-hidden="true" focusable="false"><use href="#i-kabar"/></svg>
      <span class="bell-dot" id="bellDot" hidden></span>
    </button>
  </header>

  <main class="main">
    <!-- CATAT -->
    <section class="tab" id="tab-catat" aria-labelledby="title">
      <div class="editbar" id="editBar" hidden>
        <span>Mengubah transaksi</span>
        <button class="link" type="button" data-act="batal-edit">Batal</button>
      </div>
      <div class="seg seg-jenis" id="segJenis" role="group" aria-label="Jenis transaksi">
        <button type="button" data-act="jenis" data-v="Pengeluaran">Pengeluaran</button>
        <button type="button" data-act="jenis" data-v="Pemasukan">Pemasukan</button>
        <button type="button" data-act="jenis" data-v="Transfer">Transfer</button>
      </div>
      <div class="amount-row">
        <div class="amount empty" id="amount" aria-live="polite">
          <span class="rp">Rp</span><span class="val num" id="amountVal">0</span>
        </div>
        <button type="button" class="nota-btn" id="notaBtn" data-act="nota" aria-label="Isi dari foto nota atau screenshot">
          <svg class="ic" aria-hidden="true" focusable="false"><use href="#i-nota"/></svg>
          <span>Nota</span>
        </button>
        <input type="file" id="notaFile" accept="image/*" hidden>
        <input type="file" id="notaFoto" accept="image/*" capture="environment" hidden>
      </div>
      <div class="quick" id="quick" hidden></div>
      <div class="keypad" id="keypad">
        <button type="button" data-act="key" data-k="1">1</button><button type="button" data-act="key" data-k="2">2</button><button type="button" data-act="key" data-k="3">3</button>
        <button type="button" data-act="key" data-k="4">4</button><button type="button" data-act="key" data-k="5">5</button><button type="button" data-act="key" data-k="6">6</button>
        <button type="button" data-act="key" data-k="7">7</button><button type="button" data-act="key" data-k="8">8</button><button type="button" data-act="key" data-k="9">9</button>
        <button type="button" data-act="key" data-k="000" class="k000">000</button><button type="button" data-act="key" data-k="0">0</button>
        <button type="button" data-act="key" data-k="del" aria-label="Hapus angka (tahan untuk hapus semua)">
          <svg class="ic" aria-hidden="true" focusable="false"><use href="#i-hapus-angka"/></svg>
        </button>
      </div>
      <div class="field" id="fKategori">
        <div class="label">Kategori</div>
        <div class="chips" id="chipsKategori"></div>
      </div>
      <div class="field">
        <div class="label" id="lblDompet">Dompet</div>
        <div class="chips" id="chipsDompet"></div>
      </div>
      <div class="field" id="fKe" hidden>
        <div class="label">Ke dompet</div>
        <div class="chips" id="chipsKe"></div>
      </div>
      <div class="row2">
        <div class="col-date">
        <span class="label" id="lblTanggal">Tanggal</span>
        <label class="date-chip" id="dateChip">
          <svg class="ic s" aria-hidden="true" focusable="false"><use href="#i-kalender"/></svg>
          <span id="dateLabel">Hari ini</span>
          <input type="date" id="dateInput" aria-label="Tanggal transaksi">
        </label>
        </div>
        <div class="col-note">
        <label class="label" for="catatan">Catatan (opsional)</label>
        <input class="input" id="catatan" type="text" placeholder="Misal: makan siang" maxlength="140" autocomplete="off" enterkeyhint="done">
        </div>
      </div>
      <div class="form-actions" id="formActions"></div>
    </section>

    <!-- RIWAYAT -->
    <section class="tab" id="tab-riwayat" hidden>
      <div class="monthnav">
        <button type="button" class="icon-btn" data-act="bulan" data-d="-1" aria-label="Bulan sebelumnya">
          <svg class="ic km-prev" aria-hidden="true" focusable="false"><use href="#i-chevron"/></svg>
        </button>
        <b class="rBulan"></b>
        <button type="button" class="icon-btn" data-act="bulan" data-d="1" aria-label="Bulan berikutnya">
          <svg class="ic" aria-hidden="true" focusable="false"><use href="#i-chevron"/></svg>
        </button>
      </div>
      <label class="search">
        <svg class="ic s" aria-hidden="true" focusable="false"><use href="#i-cari"/></svg>
        <input id="cari" type="search" placeholder="Cari kategori atau catatan" autocomplete="off" aria-label="Cari transaksi">
      </label>
      <div class="chips filters" id="filterJenis"></div>
      <div class="sumline" id="rSum"></div>
      <div id="rList"></div>
    </section>

    <!-- RINGKASAN -->
    <section class="tab" id="tab-ringkasan" hidden>
      <div id="sumBody"></div>
    </section>

    <!-- PENGATURAN -->
    <section class="tab" id="tab-pengaturan" hidden>
      <div id="setBody"></div>
    </section>
  </main>

  <nav class="nav" id="nav" aria-label="Menu utama">
    <button type="button" data-act="tab" data-tab="catat">
      <svg class="ic" aria-hidden="true" focusable="false"><use href="#i-catat"/></svg>
      <span>Catat</span>
    </button>
    <button type="button" data-act="tab" data-tab="riwayat">
      <svg class="ic" aria-hidden="true" focusable="false"><use href="#i-riwayat"/></svg>
      <span>Riwayat</span>
    </button>
    <button type="button" data-act="tab" data-tab="ringkasan">
      <svg class="ic" aria-hidden="true" focusable="false"><use href="#i-ringkasan"/></svg>
      <span>Ringkasan</span>
    </button>
    <button type="button" data-act="tab" data-tab="pengaturan">
      <svg class="ic" aria-hidden="true" focusable="false"><use href="#i-pengaturan"/></svg>
      <span>Pengaturan</span>
    </button>
  </nav>
</div>

<!-- Lembar (form dompet/kategori, konfirmasi) -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheetBox" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"><span id="toastText"></span><button type="button" id="toastAction" hidden></button></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
